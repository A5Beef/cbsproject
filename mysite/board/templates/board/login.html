{% extends "board/base.html" %}

{% block title %}Login - VulnerableBoard{% endblock %}

{% block content %}
    <div class="card">
        <h2>Login</h2>
        {% if form.errors %}
            <p class="notice">Invalid username or password.</p>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">Login</button>
            </div>
        </form>
        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
{% endblock %}
