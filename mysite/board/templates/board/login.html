<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - VulnerableBoard</title>
</head>
<body>

    <h1>Login</h1>

    {% if form.errors %}
        <p>Invalid username or password.</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>

    <a href="{% url 'home' %}">Back to homepage</a>

</body>
</html>
