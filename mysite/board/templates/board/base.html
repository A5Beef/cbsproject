<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VulnerableBoard{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f4f4f4;
            --surface: #ffffff;
            --text: #222222;
            --muted: #777777;
            --primary: #2463a6;
            --primary-dark: #1b4d82;
            --border: #e2e2e2;
            --danger: #a52b2b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.5;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 6px 0 0;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        nav .account {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        a {
            color: var(--primary);
        }

        a:hover {
            color: var(--primary-dark);
        }

        .thread,
        .card {
            background: var(--surface);
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .thread h3,
        .card h2 {
            margin-top: 0;
        }

        .thread a {
            text-decoration: none;
        }

        .meta {
            color: var(--muted);
            font-size: 13px;
        }

        .post {
            border-top: 1px solid var(--border);
            padding: 20px 0;
        }

        .post:first-child {
            border-top: 0;
            padding-top: 0;
        }

        .post:last-child {
            padding-bottom: 0;
        }

        .post-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            font-size: 14px;
        }

        form p {
            margin: 0 0 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        textarea {
            border: 1px solid #cfcfcf;
            border-radius: 4px;
            font: inherit;
            padding: 10px;
            width: 100%;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: var(--primary);
            border: 0;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font: inherit;
            padding: 10px 16px;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button.secondary {
            background: transparent;
            color: var(--primary);
            padding: 0;
        }

        button.danger {
            background: var(--danger);
        }

        .actions {
            align-items: center;
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }

        .errorlist {
            color: var(--danger);
            padding-left: 20px;
        }

        .notice {
            background: #fff8e1;
            border-left: 4px solid #e0ad22;
            padding: 12px 16px;
        }

        @media (max-width: 600px) {
            body {
                margin: 15px auto;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'home' %}" style="color: white;">VulnerableBoard</a></h1>
        <p>A place for discussions.</p>
    </header>

    <nav>
        <a href="{% url 'home' %}">Recent discussions</a>
        <div class="account">
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.username }}!</span>
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="secondary" type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
