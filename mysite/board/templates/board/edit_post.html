{% extends "board/base.html" %}

{% block title %}Edit Reply - VulnerableBoard{% endblock %}

{% block content %}
    <div class="card">
        <h2>Edit reply</h2>
        <p class="meta">Thread: {{ thread.title }}</p>
        <form method="POST" action="{% url 'edit_post' thread.id post.id %}">
            {% csrf_token %}
            <p>
                <label for="content">Reply:</label>
                <textarea id="content" name="content" required>{{ post.content }}</textarea>
            </p>
            <div class="actions">
                <button type="submit">Update Reply</button>
                <a href="{% url 'thread_detail' thread.id %}">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
