{% extends "board/base.html" %}

{% block title %}Register - VulnerableBoard{% endblock %}

{% block content %}
    <div class="card">
        <h2>Create an account</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">Register</button>
            </div>
        </form>
        <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
{% endblock %}
